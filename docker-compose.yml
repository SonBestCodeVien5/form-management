services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: form_management_app
    restart: always
    depends_on:
      - mongodb
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DATABASE}?authSource=admin
      SESSION_SECRET: ${SESSION_SECRET}

  mongodb:
    image: mongo:latest
    container_name: form_management_db
    restart: always
    ports:
      - "27018:27017" # Cổng 27018 bên ngoài máy thật -> 27017 bên trong Docker
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb

volumes:
  mongo_data:
  mongo_config: